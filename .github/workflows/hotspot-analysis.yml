name: 热榜热点基因分析

on:
  schedule:
    # 每小时跑一次（UTC）。中国时间 08:00-24:00 每小时第 0 分。
    # 注意：GitHub 定时任务在高峰期可能延迟几分钟
    - cron: "0 * * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

# 同一时间只跑一个，避免两轮互相覆盖
concurrency:
  group: hotspot-analysis
  cancel-in-progress: false

env:
  # 情感模型统一走国内镜像，规避 HuggingFace 原站不可达
  HF_ENDPOINT: https://hf-mirror.com

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pip 下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/hotspot-analysis.yml') }}

      - name: 缓存情感模型权重（约 390MB，命中则跳过下载）
        uses: actions/cache@v4
        with:
          path: models/hf-cache
          key: sentiment-model-senlou-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers websocket-client

      - name: 抓取热榜（微博 + 抖音）
        run: python scripts/fetch.py

      - name: 情绪三分类（senlou 微博微调模型，本地推理）
        run: python scripts/sentiment.py

      - name: 热点基因分析（Ollama Cloud，增量：只分析新上榜词条）
        env:
          LLM_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM_API_URL: https://ollama.com/v1/chat/completions
          LLM_MODEL: gpt-oss:20b
        run: python scripts/analyze.py

      # 话题参与作者：需用真实浏览器渲染微博话题页（直连会被风控跳登录）
      # runner 自带 Google Chrome；抓取失败不影响主流程（保留上一次结果）
      - name: 采集话题参与作者（headless Chrome + CDP）
        continue-on-error: true
        run: |
          google-chrome --version || chromium --version || true
          python scripts/authors.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hotspots.json data/sentiment.json data/authors.json
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 更新热点基因分析 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin main || true
          git push
