name: 热榜热点基因分析

on:
  schedule:
    # 每 3 小时跑一次（UTC 时间）
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

env:
  # 情感模型统一走国内镜像，规避 HuggingFace 原站不可达
  HF_ENDPOINT: https://hf-mirror.com

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存情感模型权重（约 390MB，命中则跳过下载）
        uses: actions/cache@v4
        with:
          path: models/hf-cache
          key: sentiment-model-senlou-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir transformers

      - name: 抓取热榜（微博 + 抖音）
        run: python scripts/fetch.py

      - name: 情绪三分类（senlou 微博微调模型，本地推理）
        run: python scripts/sentiment.py

      - name: GLM 热点基因分析（行业/形态/生命周期）
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: python scripts/analyze.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hotspots.json data/raw_hotspots.json data/sentiment.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 更新热点基因分析 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
