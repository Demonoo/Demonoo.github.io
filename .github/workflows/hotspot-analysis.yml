name: 热榜热点基因分析

on:
  schedule:
    # 每小时跑一次（UTC）。刻意避开 :00 与 :30 —— 这两个分钟是全球定时任务
    # 最拥堵的槽位，高负载时 GitHub 会把任务延迟数小时甚至直接丢弃。
    # 设两个非高峰候选分钟（:13 / :43）互为备份，提高每小时至少命中一次的几率。
    - cron: "13,43 * * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

# 同一时间只跑一个，避免两轮互相覆盖
concurrency:
  group: hotspot-analysis
  cancel-in-progress: false

env:
  # 情感模型统一走国内镜像，规避 HuggingFace 原站不可达
  HF_ENDPOINT: https://hf-mirror.com

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # 便于排查调度延迟：记录本轮由谁触发、cron 计划点、实际启动时刻
      - name: 调度探针
        run: |
          echo "event    = ${{ github.event_name }}"
          echo "schedule = ${{ github.event.schedule }}"
          echo "started  = $(date -u '+%Y-%m-%dT%H:%M:%SZ') (UTC)"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pip 下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # 固定 key：避免每次改 workflow 就整体失效、重下 torch（单轮 37min → 10min）
          key: pip-${{ runner.os }}-torch-cpu-v2
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 缓存情感模型权重（约 390MB，命中则跳过下载）
        uses: actions/cache@v4
        with:
          path: models/hf-cache
          key: sentiment-model-senlou-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers websocket-client

      - name: 抓取热榜（微博 + 抖音）
        run: python scripts/fetch.py

      - name: 情绪三分类（senlou 微博微调模型，本地推理）
        run: python scripts/sentiment.py

      - name: 热点基因分析（Ollama Cloud，全量实时：每条每轮重新分析）
        env:
          LLM_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM_API_URL: https://ollama.com/v1/chat/completions
          LLM_MODEL: gpt-oss:20b
        run: python scripts/analyze.py

      # 话题参与作者：需用真实浏览器渲染微博话题页（直连会被风控跳登录）
      # runner 自带 Google Chrome；抓取失败不影响主流程（保留上一次结果）
      - name: 采集话题参与作者（headless Chrome + CDP）
        continue-on-error: true
        run: |
          google-chrome --version || chromium --version || true
          python scripts/authors.py

      - name: 提交结果
        # 提交前逐个校验 JSON 可解析；损坏文件不 add，防止半截文件被推上线
        # （2026-09-12 线上 authors.json 曾因写入中断截断而损坏）
        run: |
          set -e
          ADD=""
          for f in data/hotspots.json data/sentiment.json data/authors.json data/history.json; do
            if python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" 2>/dev/null; then
              ADD="$ADD $f"
            else
              echo "[skip] $f JSON 损坏，本轮不提交"
            fi
          done
          if [ -z "$ADD" ]; then
            echo "无有效数据文件，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $ADD
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "data: 更新热点基因分析 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin main || true
          git push
