name: 热榜分析 · 抖音

# ── 更新节奏：自链式每小时（cron 只做兜底）──────────────────────────────
# 原理与微博完全一致，详见 hotspot-weibo.yml 顶部说明。要点：
#   · GitHub 的 schedule 触发 best-effort、会大面积丢（实测名义 48 次/天 → 实际 3~7 次）
#   · 改为「本轮跑完 → 睡到下一个 :28 → 用 GITHUB_TOKEN 自触发下一轮」
#     （官方文档明确 workflow_dispatch 是 GITHUB_TOKEN 限制的例外）
#   · cron schedule 保留作兜底；关自链式：仓库变量 CHAIN_ENABLED=false
#
# 抖音固定比微博晚 15 分钟（:28 vs :13），让两个平台对同一个 Agnes 端点的
# 调用在时间上分开，降低限流概率。抖音为微博基准管线的同构复刻，数据文件独立。

on:
  schedule:
    - cron: "28,58 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "触发来源：manual=手动；chain=自链式上一轮"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write
  actions: write   # 自链式必需：用 GITHUB_TOKEN 调 workflow_dispatch

concurrency:
  group: hotspot-douyin
  cancel-in-progress: false

env:
  HF_ENDPOINT: https://hf-mirror.com

jobs:
  douyin:
    runs-on: ubuntu-latest
    # 同微博：自链式最多等待约 80 分钟，故放宽到 180
    timeout-minutes: 180
    steps:
      - name: 调度探针
        run: |
          echo "event    = ${{ github.event_name }}"
          echo "source   = ${{ github.event.inputs.source || '(schedule 兜底)' }}"
          echo "schedule = ${{ github.event.schedule }}"
          echo "started  = $(date -u '+%Y-%m-%dT%H:%M:%SZ') (UTC)"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 缓存 pip 下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-torch-cpu-v2
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 缓存情感模型权重（约 390MB，命中则跳过下载）
        uses: actions/cache@v4
        with:
          path: models/hf-cache
          key: sentiment-model-senlou-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers websocket-client

      - name: 抓取抖音热榜
        run: python scripts/fetch.py --platform douyin

      - name: 抖音情绪三分类
        run: python scripts/sentiment.py --platform douyin

      - name: 抖音热点基因分析（Agnes 2.5 Flash）
        env:
          LLM_API_KEY: ${{ secrets.AGNES_API_KEY }}
          LLM_API_URL: https://apihub.agnes-ai.com/v1/chat/completions
          LLM_MODEL: agnes-2.5-flash
          FALLBACK_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          FALLBACK_API_URL: https://ollama.com/v1/chat/completions
          FALLBACK_MODEL: gpt-oss:20b
        run: python scripts/analyze.py --platform douyin

      # 抖音作者采集：抖音无感风控（rmc-nocaptcha）识别 headless 指纹 →
      # 必须用非 headless Chrome（真实窗口），CI 上经 xvfb 虚拟显示运行；
      # 作者来源＝话题聚合页顶部「横滑精选位」（search-horizontal-item-N）：
      #   昵称 + 认证徽章图标 URL（零请求判定红V/蓝V/黄V）+ 视频文案 + awemeid；
      #   该位不含点赞数（实测 DOM/Shadow DOM/悬停均无），likes 恒为 0；
      #   没有横滑位的话题 authors 为空 —— 是正确结果（该话题无媒体/机构参与内容）；
      #   聚合页需带 gid/hotlist_param 完整参数（fetch 已写入 raw），失败不影响主流程
      - name: 采集抖音参与作者（非 headless Chrome + xvfb）
        continue-on-error: true
        run: |
          # 注意：不要写成 `which xvfb-run || A && B`（会解析为 (which||A)&&B，永远执行安装）
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" python scripts/authors.py --platform douyin

      - name: 提交结果（仅抖音数据文件）
        run: |
          set -e
          ADD=""
          for f in data/douyin_hotspots.json data/douyin_sentiment.json data/douyin_authors.json data/douyin_history.json; do
            if python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" 2>/dev/null; then
              ADD="$ADD $f"
            else
              echo "[skip] $f JSON 损坏，本轮不提交"
            fi
          done
          if [ -z "$ADD" ]; then
            echo "无有效数据文件，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $ADD
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "data(douyin): 更新热点基因分析 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "[warn] 推送失败，5s 后重试（$i/5）"
            sleep 5
          done
          echo "[error] 推送连续失败"
          exit 1

      # ── 自链式：衔接下一轮（纯 GitHub，无外部依赖）──────────────────────
      # 详见 hotspot-weibo.yml 同步骤的注释；此处仅目标分钟不同（:28）。
      - name: 自链式 · 衔接下一轮
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_ENABLED: ${{ vars.CHAIN_ENABLED || '1' }}
          CHAIN_TARGET_MIN: "28"
        run: |
          if [ "${CHAIN_ENABLED}" != "1" ]; then
            echo "[chain] CHAIN_ENABLED=${CHAIN_ENABLED}，自链式已关闭，跳过"
            exit 0
          fi
          M=$((10#${CHAIN_TARGET_MIN}))
          m=$((10#$(date -u +%M)))
          s=$((10#$(date -u +%S)))
          delta=$(( (M - m + 60) % 60 ))
          # 至少间隔 5 分钟：避免「刚好在目标分钟上结束」时 0 秒后又跑一轮。
          # 阈值刻意取小 —— 阈值过大会让「在目标点前几分钟结束」的情况白跳一小时，
          # 而多跑一轮只是多 50 次模型调用，比漏掉一小时更新轻得多。
          if [ "$delta" -lt 5 ]; then delta=$(( delta + 60 )); fi
          wait_s=$(( delta * 60 - s ))
          echo "[chain] 现在 $(date -u '+%H:%M:%SZ')，等待 ${wait_s}s，将在每小时 :$(printf '%02d' "$M") 触发下一轮"
          sleep "$wait_s"

          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/hotspot-douyin.yml/dispatches"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/disp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d '{"ref":"main","inputs":{"source":"chain"}}') || code=000
            if [ "$code" = "204" ]; then
              echo "[chain] 已触发下一轮（HTTP 204）"
              exit 0
            fi
            echo "[chain][warn] 第 $i 次触发失败 HTTP ${code}：$(cat /tmp/disp.json 2>/dev/null)"
            sleep 15
          done
          echo "[chain][error] 连续 3 次触发失败 —— 链条已断，等 cron 兜底重启"
          exit 1
