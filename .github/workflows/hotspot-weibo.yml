name: 热榜分析 · 微博

# ── 更新节奏：自链式每小时（cron 只做兜底）──────────────────────────────
# GitHub 的 schedule 触发是 best-effort、不可靠。2026-09-12 实测：旧 workflow
# 用同样的 cron "13,43 * * * *"（名义 48 次/天），单日只触发 3~7 次、平均
# 4~5 小时才跑一轮（同一天 40 次 scheduled 的排队耗时恒为 0 分钟、单轮仅
# 13~15 分钟 → 不是队列堵塞，是 GitHub 在触发层丢弃）。官方文档亦承认
# 「high load... some queued jobs may be dropped」。
#
# 因此改为【自链式】：本轮跑完 → 睡到下一个目标分钟 → 用 GITHUB_TOKEN 调
# workflow_dispatch 触发下一轮。官方文档明确 workflow_dispatch 与
# repository_dispatch 是「GITHUB_TOKEN 触发的事件不产生新运行」的例外 ——
# 也就是自触发是被官方支持的，不需要任何外部服务或 PAT。
#   · cron schedule 保留，仅作「链条断了」时的兜底重启（数小时内生效）
#   · 关闭自链式：设置仓库变量 CHAIN_ENABLED=false，无需改本文件
#   · 代价：每小时空转约 45 分钟 runner（public 仓库分钟数无限，无费用）
#
# ── 为什么与抖音分成两个 workflow、并且错开分钟 ──────────────────────────
# 两个平台的基因分析都打同一个 Agnes 端点，单轮各约 50 次调用（≈10 分钟）。
# 挤在一次 workflow 里跑，等于一小时内对模型连打 ~100 次请求，容易触发限流
# （限流会走 Ollama 回退甚至整轮失败）。
#   微博 → 每小时的 :13（cron 另留 :43 作兜底）
#   抖音 → 每小时的 :28（cron 另留 :58 作兜底）
# 两条链固定相隔 15 分钟，保住「两平台不撞车」。
# 刻意避开 :00 / :30：这两个分钟是全球定时任务最拥堵的槽位。
#
# 两平台数据文件完全独立（data/xxx.json ↔ data/douyin_xxx.json），
# 因此各自 commit 互不重叠，不会互相覆盖。

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "触发来源：manual=手动；chain=自链式上一轮"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write
  actions: write   # 自链式必需：用 GITHUB_TOKEN 调 workflow_dispatch

# 组名按平台分开：微博与抖音互不排队、互不取消。
# 顺带天然去重：同一时刻若有两个触发进来，旧的 pending 会被新的取消 → 不会长出第二条链
concurrency:
  group: hotspot-weibo
  cancel-in-progress: false

env:
  # 情感模型统一走国内镜像，规避 HuggingFace 原站不可达
  HF_ENDPOINT: https://hf-mirror.com

jobs:
  weibo:
    runs-on: ubuntu-latest
    # 自链式要「睡到目标分钟」再触发下一轮，最多等约 80 分钟
    # → 一轮 = 实际耗时(~25min) + 等待(≤80min)，必须放宽到 180
    timeout-minutes: 180
    steps:
      # 便于排查调度延迟：记录本轮由谁触发、cron 计划点、实际启动时刻
      - name: 调度探针
        run: |
          echo "event    = ${{ github.event_name }}"
          echo "source   = ${{ github.event.inputs.source || '(schedule 兜底)' }}"
          echo "schedule = ${{ github.event.schedule }}"
          echo "started  = $(date -u '+%Y-%m-%dT%H:%M:%SZ') (UTC)"

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 两平台共用同一份 pip / 模型缓存（key 相同即共享，命中率翻倍）
      - name: 缓存 pip 下载
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # 固定 key：避免每次改 workflow 就整体失效、重下 torch（单轮 37min → 10min）
          key: pip-${{ runner.os }}-torch-cpu-v2
          restore-keys: |
            pip-${{ runner.os }}-

      - name: 缓存情感模型权重（约 390MB，命中则跳过下载）
        uses: actions/cache@v4
        with:
          path: models/hf-cache
          key: sentiment-model-senlou-${{ runner.os }}-v1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers websocket-client

      - name: 抓取微博热榜
        run: python scripts/fetch.py

      - name: 情绪三分类（senlou 微博微调模型，本地推理）
        run: python scripts/sentiment.py

      # 微博＝基准管线（前端默认平台）；抖音为同构复刻，另见 hotspot-douyin.yml
      - name: 微博热点基因分析（Agnes 2.5 Flash，全量实时：每条每轮重新分析）
        env:
          LLM_API_KEY: ${{ secrets.AGNES_API_KEY }}
          LLM_API_URL: https://apihub.agnes-ai.com/v1/chat/completions
          LLM_MODEL: agnes-2.5-flash
          # 回退：Agnes 限流/不可用时由 Ollama Cloud 接管。
          # secret 不存在 → FALLBACK_API_KEY 为空 → 回退自动禁用，不影响主流程
          FALLBACK_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          FALLBACK_API_URL: https://ollama.com/v1/chat/completions
          FALLBACK_MODEL: gpt-oss:20b
        run: python scripts/analyze.py

      # 话题参与作者：需用真实浏览器渲染微博话题页（直连会被风控跳登录）
      # runner 自带 Google Chrome；抓取失败不影响主流程（保留上一次结果）
      - name: 采集话题参与作者（headless Chrome + CDP）
        continue-on-error: true
        run: |
          google-chrome --version || chromium --version || true
          python scripts/authors.py

      - name: 提交结果（仅微博数据文件）
        # 提交前逐个校验 JSON 可解析；损坏文件不 add，防止半截文件被推上线
        # （2026-09-12 线上 authors.json 曾因写入中断截断而损坏）
        run: |
          set -e
          ADD=""
          for f in data/hotspots.json data/sentiment.json data/authors.json data/history.json; do
            if python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" 2>/dev/null; then
              ADD="$ADD $f"
            else
              echo "[skip] $f JSON 损坏，本轮不提交"
            fi
          done
          if [ -z "$ADD" ]; then
            echo "无有效数据文件，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $ADD
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "data(weibo): 更新热点基因分析 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
          # 抖音 workflow 也在推同一个分支：先 rebase 再推，失败重试，
          # 避免两侧提交时间靠近时后推的一方被 non-fast-forward 拒掉
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "[warn] 推送失败，5s 后重试（$i/5）"
            sleep 5
          done
          echo "[error] 推送连续失败"
          exit 1

      # ── 自链式：衔接下一轮（纯 GitHub，无外部依赖）──────────────────────
      # 必须放在最后一步：它会把 runner 占用到目标分钟才退出。
      # if: always() —— 即使前面某步失败，链条也不能断，否则小时级更新的前提就没了。
      # 触发失败的兜底有两层：① 本步自带 3 次重试；② cron schedule 兜底重启。
      - name: 自链式 · 衔接下一轮
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAIN_ENABLED: ${{ vars.CHAIN_ENABLED || '1' }}
          CHAIN_TARGET_MIN: "13"
        run: |
          if [ "${CHAIN_ENABLED}" != "1" ]; then
            echo "[chain] CHAIN_ENABLED=${CHAIN_ENABLED}，自链式已关闭，跳过"
            exit 0
          fi
          M=$((10#${CHAIN_TARGET_MIN}))
          m=$((10#$(date -u +%M)))
          s=$((10#$(date -u +%S)))
          delta=$(( (M - m + 60) % 60 ))
          # 至少间隔 5 分钟：避免「刚好在目标分钟上结束」时 0 秒后又跑一轮。
          # 阈值刻意取小 —— 阈值过大会让「在目标点前几分钟结束」的情况白跳一小时，
          # 而多跑一轮只是多 50 次模型调用，比漏掉一小时更新轻得多。
          if [ "$delta" -lt 5 ]; then delta=$(( delta + 60 )); fi
          wait_s=$(( delta * 60 - s ))
          echo "[chain] 现在 $(date -u '+%H:%M:%SZ')，等待 ${wait_s}s，将在每小时 :$(printf '%02d' "$M") 触发下一轮"
          sleep "$wait_s"

          URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/hotspot-weibo.yml/dispatches"
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/disp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d '{"ref":"main","inputs":{"source":"chain"}}') || code=000
            if [ "$code" = "204" ]; then
              echo "[chain] 已触发下一轮（HTTP 204）"
              exit 0
            fi
            echo "[chain][warn] 第 $i 次触发失败 HTTP ${code}：$(cat /tmp/disp.json 2>/dev/null)"
            sleep 15
          done
          echo "[chain][error] 连续 3 次触发失败 —— 链条已断，等 cron 兜底重启"
          exit 1
